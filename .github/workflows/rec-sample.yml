# Saves the UA rec center's live headcounts every 30 minutes, so Hybrid's
# "usual quiet times" charts fill in without opening the app.
# Hours are UTC: 10:07–05:37 covers 5 AM–12:37 AM Central (4 AM–11:37 PM in winter);
# the app skips any run while both buildings are closed. Runs at :07 and :37 because
# GitHub often delays or drops scheduled runs at :00 and :30, its busiest times.
# It still drops most of them, so a cron-job.org job now does the main work and
# this is a backup.
name: Rec center counts

on:
  schedule:
    - cron: "7,37 0-5,10-23 * * *"
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Save the latest counts
        env:
          APP_URL: ${{ vars.HYBRID_URL || 'https://hybrid-app-sepia.vercel.app' }}
        # The app answers 200 even when it couldn't save, so fail the run on an error reply
        # ("error: …" or "no feed key"); "ok" and "skipped: …" are fine.
        run: |
          body=$(curl -fsS --max-time 60 -X POST "$APP_URL/api/rec/sample")
          echo "$body"
          status=$(jq -r '.status // empty' <<<"$body")
          case "$status" in
            ok|skipped*) ;;
            *) echo "::error::Rec sampler answered: ${status:-$body}"; exit 1 ;;
          esac
